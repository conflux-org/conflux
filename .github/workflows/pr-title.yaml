name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [master]

permissions:
  pull-requests: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            style
            perf
            test
            docs
            chore
            ci

          requireScope: true
